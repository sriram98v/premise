[package]
name = "premise"
version = "0.4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bio = "4.0.1"
indicatif = {version="0.18.6", features = ["rayon"]}
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12.0"
itertools = "0.15.0"
anyhow = "1.0.104"
flate2 = "1.1.9"
chrono = "0.4.45"
haystackfm = { git = "https://github.com/sriram98v/haystackfm", tag = "v0.5.0", features = ["cpu"] }
bincode = "1.3.3"
dashmap = "6.2.1"
num = "0.4.3"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
ureq = { version = "3", default-features = false }
savefile = "0.20.5"
criterion = { version = "0.8", features = ["html_reports"] }

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["flamegraph", "criterion", "protobuf-codec"] }

[[bench]]
name = "alignment"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
debug = true

[profile.bench]
lto = "fat"
codegen-units = 1
debug = true
